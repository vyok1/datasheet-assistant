
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "datasheet-assistant"
version = "0.1.0"
description = "Retrieval and analysis of technical datasheets"
requires-python = ">=3.11"
dependencies = [
    "rank-bm25>=0.2.2",
    "sentence-transformers>=2.2.0",
]

[tool.setuptools.packages.find]
where = ["src"]
